name: Chromium UI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start local simulator
        run: |
          npm start > /tmp/phishing-simulator.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/phishing-simulator.log
          exit 1
      - name: Run Chromium checks
        run: python -m pytest -q tests/browser
        env:
          PHISHING_SIMULATOR_BASE_URL: http://127.0.0.1:3000
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phishing-simulator-browser-diagnostics
          path: /tmp/phishing-simulator.log
          if-no-files-found: ignore
